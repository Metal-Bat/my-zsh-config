# Erfan's Kitty settings, condensed from the uploaded configuration.
# Reference: https://sw.kovidgoyal.net/kitty/conf/
# Setup and shortcuts: docs/kitty.md in this repository.

# Install all four MesloLGS NF font faces; `kitten choose-fonts` previews them.
font_family family="MesloLGS NF"
bold_font auto
italic_font auto
bold_italic_font auto

# Animate cursor jumps after the cursor has remained still for 200 ms.
cursor_trail 200
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Terminal history and pointer behavior.
scrollback_lines 5000
mouse_hide_wait 3.0

# Window appearance and rounded powerline tabs.
hide_window_decorations yes
tab_bar_style powerline
tab_powerline_style round

# 85% opaque background; a desktop compositor must support transparency.
background_opacity 0.85
dynamic_background_opacity yes

# The original current-theme.conf was not supplied. Keep your existing file
# or create one with `kitten themes`. With no file, Kitty uses its defaults.
# globinclude makes the absent file optional.
globinclude current-theme.conf

# Optional machine-specific overrides, loaded after the shared defaults.
globinclude local.conf
